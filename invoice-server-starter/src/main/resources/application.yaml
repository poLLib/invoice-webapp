server:
  port: 8080

springdoc:
  api-docs.path: /api-docs

spring:
  application:
    name: "invoice-webapp"


  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
    show-sql: true

  datasource:
    url: jdbc:mariadb://localhost:3306/invoiceapp
    username: invoiceapp_user
    password: invoiceapp_pass
    driver-class-name: org.mariadb.jdbc.Driver

  jackson:
    mapper:
      accept-case-insensitive-enums: true

  output:
    ansi:
      enabled: ALWAYS

  flyway:
    enabled: true
    url: jdbc:mariadb://localhost:3306/invoiceapp
    user: invoiceapp_user
    password: invoiceapp_pass
    locations:
      - classpath:db/migration
      - classpath:db/test-data
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

jwt:
  expiration: 86400000
