services:
  mariadb:
    image: mariadb:11.7
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: invoiceapp
      MYSQL_DATABASE: invoiceapp
      MYSQL_USER: invoiceapp_user
      MYSQL_PASSWORD: invoiceapp_pass
    ports:
      - "3306:3306"
    networks:
      - invoiceapp_network
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  invoiceapp_network:
    driver: bridge